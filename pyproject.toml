[project]
name = "omniscatter"
version = "0.1.0"
description = "One problem spec, many electromagnetic scattering solvers (Mie, T-matrix, DDA, FDTD) on CPU and GPU, built for humans and AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Feghali", email = "alexander.al-feghali@mail.mcgill.ca" }
]
requires-python = ">=3.10"
keywords = ["mie", "t-matrix", "dda", "fdtd", "plasmonics", "nanophotonics", "scattering", "gpu"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "array-api-compat>=1.11",
    "miepython>=3.0",
    "numpy>=2.0",
    "pydantic>=2.6",
    "scipy>=1.10",
]

[project.optional-dependencies]
# GPU array framework for the native solvers. On Windows/Linux the dev setup
# below pulls CUDA 12.8 wheels (needed for RTX 50xx / Blackwell).
gpu = ["torch>=2.7"]
mcp = ["mcp>=1.2"]
# treams pins scipy<1.17 and Python<3.14 (upstream: scipy.special.sph_harm removal)
tmatrix = ["treams>=0.4.7,<0.5; python_version < '3.14'"]
# gdsfactory is MIT, but pulls in klayout (GPL-3.0-or-later) via kfactory; kept optional
# and imported lazily. Our own GDS reader in layout.py needs no extra.
layout = ["gdsfactory>=9; python_version >= '3.11'"]
xarray = ["xarray>=2024.1"]

[project.scripts]
omniscatter = "omniscatter.cli:main"
omniscatter-mcp = "omniscatter.mcp_server:main"

[project.urls]
Repository = "https://github.com/omniscatter/omniscatter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]  # plugins/ have their own environments and test suites
markers = [
    "gpu: needs a CUDA GPU",
    "slow: long-running convergence checks",
    "network: needs internet; set OMNISCATTER_NETWORK_TESTS=1",
]
