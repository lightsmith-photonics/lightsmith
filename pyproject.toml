[project]
name = "lightsmith"
version = "0.2.0"
description = "Open photonics suite: one typed JSON problem spec solved by Mie, T-matrix, DDA, FDTD, TMM, RCWA, FDE, EME, FDFD, PWE and circuit solvers on CPU or GPU, with differentiable inverse design, built for humans and AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Feghali", email = "alexander.al-feghali@mail.mcgill.ca" }
]
requires-python = ">=3.10"
keywords = [
    "photonics", "nanophotonics", "plasmonics", "electromagnetics", "scattering", "mie", "t-matrix", "dda",
    "fdtd", "fdfd", "rcwa", "tmm", "eme", "waveguide", "photonic-crystal", "photonic-circuit", "inverse-design",
    "gpu", "mcp", "ai-agents",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "array-api-compat>=1.11",
    "miepython>=3.0",
    "numpy>=2.0",
    "pydantic>=2.6",
    "scipy>=1.10",
]

[project.optional-dependencies]
# GPU array framework for the native solvers. On Windows/Linux the dev setup
# below pulls CUDA 12.8 wheels (needed for RTX 50xx / Blackwell).
gpu = ["torch>=2.7"]
# MCP server (lightsmith-mcp). mcp 2.x: MCPServer API, protocol 2026-07-28 with fallback to older clients.
mcp = ["mcp>=2.3,<3"]
# treams pins scipy<1.17 and Python<3.14 (upstream: scipy.special.sph_harm removal)
tmatrix = ["treams>=0.4.7,<0.5; python_version < '3.14'"]
# gdsfactory is MIT, but pulls in klayout (GPL-3.0-or-later) via kfactory; kept optional
# and imported lazily. Our own GDS reader in layout.py needs no extra.
layout = ["gdsfactory>=9; python_version >= '3.11'"]
xarray = ["xarray>=2024.1"]

[project.scripts]
lightsmith = "lightsmith.cli:main"
lightsmith-mcp = "lightsmith.mcp_server:main"

[project.urls]
Homepage = "https://lightsmith.dev/"
Documentation = "https://docs.lightsmith.dev/"
Repository = "https://github.com/lightsmith-photonics/lightsmith"
Issues = "https://github.com/lightsmith-photonics/lightsmith/issues"
Changelog = "https://github.com/lightsmith-photonics/lightsmith/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 licence metadata (License-Expression, License-File)
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightsmith"]  # includes data/materials/* and py.typed

[tool.hatch.build.targets.sdist]
include = [
    "/src/lightsmith",
    "/tests",
    "/examples",
    "/docs",
    "/mkdocs.yml",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/llms.txt",
]
exclude = ["__pycache__", "*.py[oc]"]

[dependency-groups]
dev = [
    "pytest>=8",
]
# Documentation site: `uv run --group docs mkdocs build --strict` (see RELEASING.md)
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]  # benchmarks are run separately (benchmarks/run.py)
markers = [
    "gpu: needs a CUDA GPU",
    "slow: long-running convergence checks",
    "network: needs internet; set LIGHTSMITH_NETWORK_TESTS=1",
]
